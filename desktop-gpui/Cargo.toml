[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
sam-protocol = { path = "crates/sam-protocol" }
sam-client = { path = "crates/sam-client" }

# runtime_shaders: compile Metal shaders at runtime instead of via the `metal`
# CLI (this machine's Xcode 26.5 lacks the Metal Toolchain component; fix via
# `xcodebuild -downloadComponent MetalToolchain` before release packaging in M6).
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.1", features = ["webview", "tree-sitter-languages"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
cpal = "0.15"
hound = "3.5"
anyhow = "1"
thiserror = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

[profile.dev]
# gpui is heavy; keep dependencies optimized while our code stays debuggable
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
